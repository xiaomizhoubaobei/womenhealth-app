name: Build and Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v3

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Download release keystore
      run: |
        curl -L -o app/release.keystore https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/release.keystore
        echo "release.keystore downloaded"

    - name: Build APK
      run: ./gradlew assembleRelease
      env:
        RELEASE_STORE_FILE: release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: LuminCore

    - name: Secure cleanup of keystore
      if: always()
      run: |
        if command -v shred >/dev/null 2>&1; then
          shred -u app/release.keystore || true
        else
          rm -f app/release.keystore
        fi
        echo "Keystore removed"

    - name: Extract version info
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/LuminCore-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk

    - name: Check if tag exists
      id: check_tag
      run: |
        TAG="v${{ steps.version.outputs.version_name }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate Release Notes
      id: release_notes
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -z "$PREV_TAG" ]; then
          COMMITS=$(git log --no-merges --pretty=format:"%s")
        else
          COMMITS=$(git log --no-merges --pretty=format:"%s" ${PREV_TAG}..HEAD)
        fi

        COMMITS=$(echo "$COMMITS" | sort -u)

        FEATURES=""
        FIXES=""
        CHORES=""
        OTHERS=""

        while IFS= read -r line; do
          case "$line" in
            feat\(*:*)
              FEATURES="${FEATURES}- $(echo "$line" | sed -E 's/^(feat|fix|chore)\(([^)]+)\): //')"
              ;;
            fix\(*:*)
              FIXES="${FIXES}- $(echo "$line" | sed -E 's/^(feat|fix|chore)\(([^)]+)\): //')"
              ;;
            chore\(*:*)
              CHORES="${CHORES}- $(echo "$line" | sed -E 's/^(feat|fix|chore)\(([^)]+)\): //')"
              ;;
            feat:*)
              FEATURES="${FEATURES}- $(echo "$line" | sed -E 's/^(feat|fix|chore): //')"
              ;;
            fix:*)
              FIXES="${FIXES}- $(echo "$line" | sed -E 's/^(feat|fix|chore): //')"
              ;;
            chore:*)
              CHORES="${CHORES}- $(echo "$line" | sed -E 's/^(feat|fix|chore): //')"
              ;;
            *)
              OTHERS="${OTHERS}- $line"
              ;;
          esac
        done <<< "$COMMITS"

        NOTES=""
        [ -n "$FEATURES" ] && NOTES="${NOTES}## 🚀 Features\n${FEATURES}\n"
        [ -n "$FIXES" ]    && NOTES="${NOTES}## 🐛 Bug Fixes\n${FIXES}\n"
        [ -n "$CHORES" ]   && NOTES="${NOTES}## 🧹 Chores\n${CHORES}\n"
        [ -n "$OTHERS" ]   && NOTES="${NOTES}## 📌 Others\n${OTHERS}\n"

        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo -e "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.version.outputs.version_name }}
        name: Release v${{ steps.version.outputs.version_name }}
        draft: false
        prerelease: false
        body: ${{ steps.release_notes.outputs.notes }}
        files: |
          app/build/outputs/apk/release/LuminCore-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
