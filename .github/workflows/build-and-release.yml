name: 构建并发布 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 下载签名证书
        run: |
          curl -L -o app/release.keystore https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/release.keystore
          echo "签名证书下载完成"

      - name: 构建 APK
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: LuminCore

      - name: 安全清理签名证书
        if: always()
        run: |
          if command -v shred >/dev/null 2>&1; then
            shred -u app/release.keystore || true
          else
            rm -f app/release.keystore
          fi
          echo "签名证书已移除"

      - name: 读取版本信息
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: 重命名 APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/LuminCore-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk

      - name: 校验 APK 签名与证书指纹
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/LuminCore-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk

          echo "🔍 校验 APK 签名..."
          apksigner verify --print-certs "$APK"

          echo "🔐 提取签名证书 SHA-256..."
          CERT_SHA256=$(apksigner verify --print-certs "$APK" \
            | grep "SHA-256 digest:" \
            | head -1 \
            | awk '{print $NF}' \
            | tr '[:upper:]' '[:lower:]')

          echo "预期指纹: $EXPECTED_CERT_SHA256"
          echo "实际指纹: $CERT_SHA256"

          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo ""
            echo "❌ 签名证书指纹不匹配！"
            echo "该 APK 并非使用受信任的 LuminCore 签名。"
            exit 1
          fi

          echo "✅ 证书指纹校验通过"

      - name: 生成 APK 校验值
        id: checksum
        run: |
          APK=app/build/outputs/apk/release/LuminCore-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk

          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha1=$(sha1sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "md5=$(md5sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT

          CERT_SHA256=$(apksigner verify --print-certs "$APK" \
            | grep "SHA-256 digest:" \
            | head -1 \
            | awk '{print $NF}')

          echo "cert_sha256=$CERT_SHA256" >> $GITHUB_OUTPUT

      - name: 检查 Tag 是否已存在
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 生成 Release 说明（仅用户可见变更）
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"%s")
          else
            COMMITS=$(git log --no-merges --pretty=format:"%s" ${PREV_TAG}..HEAD)
          fi

          COMMITS=$(echo "$COMMITS" | sort -u)

          FEATURES=""
          FIXES=""

          while IFS= read -r line; do
            case "$line" in
              feat\(*:*)
                FEATURES="${FEATURES}- $(echo "$line" | sed -E 's/^feat\(([^)]+)\): //')"
                ;;
              fix\(*:*)
                FIXES="${FIXES}- $(echo "$line" | sed -E 's/^fix\(([^)]+)\): //')"
                ;;
              feat:*)
                FEATURES="${FEATURES}- ${line#*: }"
                ;;
              fix:*)
                FIXES="${FIXES}- ${line#*: }"
                ;;
              *)
                # 忽略 chore/docs/refactor/ci/perf/test/style 等内部变更
                ;;
            esac
          done <<< "$COMMITS"

          NOTES=""

          if [ -n "$FEATURES" ] || [ -n "$FIXES" ]; then
            [ -n "$FEATURES" ] && NOTES="${NOTES}## 🚀 新功能\n${FEATURES}\n"
            [ -n "$FIXES" ]    && NOTES="${NOTES}## 🐛 问题修复\n${FIXES}\n"
          else
            NOTES="## 🔧 内部优化\n- 提升稳定性与性能\n"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: false
          body: |
            ${{ steps.release_notes.outputs.notes }}

            ---

            ## 🔐 APK 签名与完整性校验

            | 项目 | 值 |
            |----|----|
            | **签名别名** | `LuminCore` |
            | **证书持有者** | `CN=qixiaoxin, L=Shanghai, C=CN` |
            | **证书 SHA-256** | `${{ steps.checksum.outputs.cert_sha256 }}` |
            | **APK SHA-256** | `${{ steps.checksum.outputs.sha256 }}` |

            ✅ 已启用证书指纹强校验
            ✅ 证书有效期至 2126-02-17
            ✅ CI 将拒绝任何非受信任签名
          files: |
            app/build/outputs/apk/release/LuminCore-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
