org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Signing configuration - Use environment variables for security
# These values will be used if local.properties doesn't define them
# Or they can be overridden by command line: -PKEYSTORE_FILE=path -PKEYSTORE_PASSWORD=pass

# Keystore configuration (can be set via environment variables or command line)
# KEYSTORE_FILE=../keystores/release.keystore
# KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
# KEY_ALIAS=${KEY_ALIAS}
# KEY_PASSWORD=${KEY_PASSWORD}

# Signature versions - enable v1, v2, v3, v4 for maximum compatibility
android.signingConfigs.release.v1SigningEnabled=true
android.signingConfigs.release.v2SigningEnabled=true
android.signingConfigs.release.v3SigningEnabled=true
android.signingConfigs.release.v4SigningEnabled=true
