# ==========================================
# CNB Web Trigger 配置
# 功能：在分支详情页添加手动触发构建按钮
# 文档：https://docs.cnb.cool/zh/build/web-trigger.html
# ==========================================

- reg: ^main$
  buttons:
    - name: 手动构建 APK
      description: 手动触发流水线构建 Release APK
      event: web_trigger_build_apk
      isDefault: true
      groupName: 构建操作
