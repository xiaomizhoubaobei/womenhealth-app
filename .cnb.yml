# ==========================================
# CNB 构建配置文件
# 项目：健康助手 App (womenhealth-app-demo)
# ==========================================

# ==========================================
# 第一部分：全局环境变量定义
# ==========================================

env:
  # Gradle 配置
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=true'

  # Android 签名配置 — 密钥库导入变量名到 Gradle 期望变量名的映射
  # RELEASE_STORE_FILE: keystore 文件路径（相对于 app/ 目录，因为 build.gradle.kts 中 file() 解析基于模块目录）
  RELEASE_STORE_FILE: release.keystore
  RELEASE_STORE_PASSWORD: $KEYSTORE_PASSWORD
  RELEASE_KEY_PASSWORD: $KEY_PASSWORD
  RELEASE_KEY_ALIAS: LuminCore
  RELEASE_KEY_DNAME: 'CN=祁筱欣, L=徐汇区, ST=上海市, C=CN'
  # GEMINI_API_KEY safe default (empty string) for CI builds;
  # set real value in secrets repo or local .env if needed
  GEMINI_API_KEY: ''
  # 签名证书 SHA-256 指纹校验（用于 apksigner 强校验）
  # 在 key/Android.yml secrets 中配置实际值
  EXPECTED_SIGNING_CERT_SHA256: $EXPECTED_SIGNING_CERT_SHA256

# ==========================================
# 第二部分：锚点定义（可复用配置块）
# ==========================================

# Docker 构建配置锚点
.docker_build_template: &docker_build_template
  image: docker.cnb.cool/xmzzuzhi/cnb-docker/android:0.0.1
  volumes:
    - /root/.gradle/caches
    - /root/.gradle/wrapper

# Android 构建阶段锚点（通用：push / tag_push / web_trigger 均引用此锚点）
.android_build_stages: &android_build_stages
  - name: Make gradlew executable
    script: chmod +x ./gradlew

  - name: Download release keystore
    script: |
      curl -L -o app/release.keystore https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/release.keystore
      echo "✅ Keystore downloaded"

  - name: Build APK
    # 注意：RELEASE_STORE_PASSWORD 和 RELEASE_KEY_PASSWORD 由密钥仓库导入自动注入
    # 密钥仓库导入的变量会直接成为环境变量，无需在此重新声明
    # 全局 env 已配置 RELEASE_STORE_FILE 和 RELEASE_KEY_ALIAS
    script: ./gradlew assembleRelease

  - name: Extract version info
    script: |
      # 提取对外版本号（versionName）和内部构建号（versionCode）
      BUILD_NUMBER=$(grep -E "versionCode\s*=" app/build.gradle.kts | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
      VERSION=$(grep -E "versionName\s*=" app/build.gradle.kts | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
      BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
      echo "##[set-output BUILD_NUMBER=$BUILD_NUMBER]"
      echo "##[set-output VERSION=$VERSION]"
      echo "##[set-output BUILD_TIME=$BUILD_TIME]"
    exports:
      BUILD_NUMBER: BUILD_NUMBER
      VERSION: VERSION
      BUILD_TIME: BUILD_TIME

  - name: Ensure apksigner available
    script: |
      if ! command -v apksigner &>/dev/null; then
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1 | xargs -r dirname)
        if [ -z "$BUILD_TOOLS" ]; then
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
        fi
        export PATH="$BUILD_TOOLS:$PATH"
        echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
      fi
      apksigner --version

  - name: Verify APK signature
    script: |
      APK="app/build/outputs/apk/release/app-release.apk"
      apksigner verify --print-certs "$APK"

      CERT_SHA256=$(apksigner verify --print-certs "$APK" \
        | grep "SHA-256 digest:" \
        | head -1 \
        | awk '{print $NF}' \
        | tr '[:upper:]' '[:lower:]')

      echo "Expected: $EXPECTED_SIGNING_CERT_SHA256"
      echo "Actual:   $CERT_SHA256"

      if [ "$CERT_SHA256" != "$EXPECTED_SIGNING_CERT_SHA256" ]; then
        echo "❌ Signing certificate mismatch"
        exit 1
      fi

      echo "✅ Certificate verified"

  - name: Generate checksums
    script: |
      APK="app/build/outputs/apk/release/app-release.apk"
      echo "SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
      echo "SHA1=$(sha1sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
      echo "MD5=$(md5sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT

  - name: Prepare artifact
    script: |
      mkdir -p release
      APK="release/LuminCore-v${VERSION}-${BUILD_NUMBER}.apk"
      cp app/build/outputs/apk/release/app-release.apk "$APK"
      ln -sf "$(basename "$APK")" release/LuminCore-latest.apk

  - name: Secure cleanup
    if: "true"
    script: |
      if command -v shred >/dev/null 2>&1; then
        shred -u app/release.keystore || true
      else
        rm -f app/release.keystore
      fi
      echo "✅ Keystore removed"

  - name: Upload APK (non-tag)
    # 仅在非 tag_push 事件时上传到 commit 附件；tag_push 由后面的 Attach APK to Release 处理
    if: |
      [ "$CNB_EVENT" != "tag_push" ]
    image: cnbcool/attachments:latest
    settings:
      attachments:
        - release/LuminCore-v${VERSION}-${BUILD_NUMBER}.apk

  - name: Generate changelog
    # 仅在 tag_push 时生成变更日志
    if: |
      [ "$CNB_EVENT" = "tag_push" ]
    image: cnbcool/changelog
    settings:
      latestChangeLogTarget: LATEST_CHANGELOG.md

  - name: Prepare release notes
    # 仅在 tag_push 时生成语义化 Release Notes（feat/fix 分类）
    if: |
      [ "$CNB_EVENT" = "tag_push" ]
    script: |
      FEATURES=$(sed -En 's/^- feat(\([^)]+\))?:\s*/- /p' LATEST_CHANGELOG.md)
      FIXES=$(sed -En 's/^- fix(\([^)]+\))?:\s*/- /p' LATEST_CHANGELOG.md)
      {
        echo "## LuminCore v${VERSION}"
        echo ""
        echo "构建信息"
        echo "- Version: ${VERSION}"
        echo "- Build: ${BUILD_NUMBER}"
        echo "- Time: ${BUILD_TIME}"
        echo "- Commit: ${CNB_COMMIT}"
        echo ""
        echo "### 新功能"
        echo "${FEATURES:-无}"
        echo ""
        echo "### 问题修复"
        echo "${FIXES:-无}"
      } > RELEASE_NOTES.md

  - name: Create Release
    # 仅在 tag_push 事件时创建 Release；main.push / web_trigger 时自动跳过
    if: |
      [ "$CNB_EVENT" = "tag_push" ]
    type: git:release
    options:
      # tag_push 事件无需传入 tag 参数，自动取触发事件的 Tag 名
      title: "LuminCore v${VERSION}"
      # description 与 descriptionFromFile 互斥，使用文件以包含自动生成的变更日志
      descriptionFromFile: RELEASE_NOTES.md

  - name: Attach APK to Release
    # tag_push 事件下不传 tag 参数时，默认取 $CNB_BRANCH（即当前 tag），操作对象为 tag 对应的 release 附件
    # 文档说明："tag 需有对应的 release 才能上传附件"，因此必须放在 git:release 创建之后
    if: |
      [ "$CNB_EVENT" = "tag_push" ]
    image: cnbcool/attachments:latest
    settings:
      type: UPLOAD
      attachments:
        - release/LuminCore-v${VERSION}-${BUILD_NUMBER}.apk

# ==========================================
# 第三部分：构建工作流定义
# ==========================================

# ------------------------------------------
# 生产构建流程 (main 分支)
# ------------------------------------------
main:
  push:
    # 同步 main 分支到 GitHub 仓库
    - name: sync-to-github
      services:
        - docker
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
      stages:
        - name: 同步到GitHub
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/xiaomizhoubaobei/womenhealth-app.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            git_user: ${GIT_USERNAME}
            git_email: ${GIT_EMAIL}
            force: true

  # PR 构建测试（向 main 提交 PR 时触发，验证编译是否通过）
  pull_request:
    - name: pr-build-test
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Android.yml
      docker: *docker_build_template
      stages:
        - name: Make gradlew executable
          script: chmod +x ./gradlew

        - name: Download release keystore
          script: |
            curl -L -o app/release.keystore https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/release.keystore
            echo "✅ Keystore downloaded"

        - name: Build APK
          script: ./gradlew assembleRelease

        - name: Secure cleanup
          if: "true"
          script: |
            if command -v shred >/dev/null 2>&1; then
              shred -u app/release.keystore || true
            else
              rm -f app/release.keystore
            fi
            echo "✅ Keystore removed"

  # 手动触发构建（web_trigger，通过 .cnb/web_trigger.yml 按钮触发）
  web_trigger_build_apk:
    - name: manual-build-apk
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Android.yml
      docker: *docker_build_template
      stages: *android_build_stages

# ------------------------------------------
# Tag 推送：自动构建并创建 Release
# 任意分支推送 Tag 时触发，Release 相关阶段通过 if 条件自动执行
# ------------------------------------------
$:
  tag_push:
    - name: build-and-release-on-tag
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Android.yml
      docker: *docker_build_template
      stages: *android_build_stages

# ==========================================
# 第四部分：开发环境配置
# ==========================================

# ------------------------------------------
# VSCode 开发环境 (包含 AI 工具链)
# ------------------------------------------
vscode:
  - docker:
      image: docker.cnb.cool/xmzzuzhi/cnb-docker/android:0.0.1
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
      runner:
        cpus: 32
      services:
        - vscode
        - docker
      stages:
        # --- 权限设置 ---
        - name: 授予脚本执行权限
          script: chmod +x /workspace/install_gpg_keys.sh

        # --- AI 编码工具安装 ---
        - name: 安装 iflow CLI
          script: |
            npm i -g @iflow-ai/iflow-cli@latest --verbose
            echo "iflow CLI 安装完成"

        - name: 安装 Claude CLI
          script: |
            npm install -g @anthropic-ai/claude-code --verbose
            echo "Claude CLI 安装完成"

        - name: 安装 OpenCode
          script: |
            npm install -g opencode-ai --verbose
            echo "OpenCode 安装完成"
            mkdir -p /root/.config/opencode/
            curl -o /root/.config/opencode/opencode.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/opencode.json

        - name: 安装 Qwen CLI
          script: |
            npm install -g @qwen-code/qwen-code@latest --verbose
            echo "Qwen CLI 安装完成"

        - name: 安装 CodeBuddy CLI
          script: |
            npm install -g @tencent-ai/codebuddy-code --verbose
            echo "CodeBuddy CLI 安装完成"

        - name: 安装 KIMI Code
          script: |
            curl -LsSf https://code.kimi.com/install.sh | bash
            echo "KIMI Code 安装完成"

        - name: 安装 Qoder CLI
          script: |
            curl -fsSL https://qoder.com/install | bash
            echo "Qoder CLI 安装完成"

        # --- 配置文件 ---
        - name: 下载 iflow 配置
          script: |
            mkdir -p /root/.iflow
            curl -o /root/.iflow/settings.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/1.json
            echo "已下载并替换 /root/.iflow/settings.json"

        # --- 系统依赖 ---
        - name: 安装系统依赖
          script: |
            sudo apt-get update
            sudo apt-get install -y lsof net-tools jq git-lfs
            git lfs install
            echo "系统依赖安装完成"

        # --- 智能体安装 ---
        - name: 安装 iflow 智能体
          script: |
            chmod +x /workspace/install_agents.sh
            /workspace/install_agents.sh

# ==========================================
# 配置文件结束
# ==========================================
